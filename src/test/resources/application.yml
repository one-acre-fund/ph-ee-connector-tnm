server:
  port: 0

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

tnm-connector:
  redis:
    type: memory
    key-prefix: tnm-connector-test
    ttl:
      paybill-workflow-seconds: 172800

camel:
  server-port: 15009
  springboot:
    main-run-controller: true
  dataformat:
    jackson:
      auto-discover-object-mapper: true

zeebe:
  client:
    max-execution-threads: 100
    number-of-workers: 5
    evenly-allocated-max-jobs: "#{${zeebe.client.max-execution-threads} / ${zeebe.client.number-of-workers}}"
  broker:
    contactpoint: "localhost:26500"
  init-transfer:
    wait-timer: 5
  wait-tnm-pay-request-period: 60

channel:
  host: "http://localhost:8080"

tenant: "malawi"

paybill:
  account-holding-institution-id: "malawi"
  default-ams: "fineract"
  default-ams-short-code: "12345678"
  groups:
    - business-short-code: "24322607"
      ams: "fineract"
      base-url: "http://localhost:5007"
      currency: "MWK"
    - business-short-code: "12345678"
      ams: "roster"
      base-url: "http://localhost:5000"
      currency: "MWK"
